<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Filmoteka — My Library</title>
</head>
<body>

  <!-- Overlay -->
  <div class="sidebar-overlay" id="overlay"></div>

  <!-- Боковое меню -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <svg class="brand-logo" viewBox="0 0 24 24" fill="currentColor">
        <path d="M19.8 3H4.2C3 3 2 4 2 5.2v13.6C2 20 3 21 4.2 21h15.6c1.2 0 2.2-1 2.2-2.2V5.2C22 4 21 3 19.8 3zM7 19H4.2c-.1 0-.2-.1-.2-.2V5.2c0-.1.1-.2.2-.2H7v14zm10 0H9V5h8v14zm2.8.2c0 .1-.1.2-.2.2H19V5h.8c.1 0 .2.1.2.2v13.6z"/>
        <path d="M11.5 9.5l4 2.5-4 2.5z"/>
      </svg>
      <span class="brand-name">Filmoteka</span>
    </div>

    <div class="sidebar-search-slot" id="mobileSearchSlot"></div>

    <div class="sidebar-nav">
      <div class="sidebar-nav-title">Menu</div>
      <a href="index.html" class="sidebar-link"><span class="icon">🔥</span> Home</a>
      <a href="library.html" class="sidebar-link active"><span class="icon">🔖</span> My Library</a>
    </div>

    <div class="sidebar-nav">
      <div class="sidebar-nav-title">Information</div>
      <a href="#" class="sidebar-link"><span class="icon">ℹ️</span> About</a>
      <a href="#" class="sidebar-link"><span class="icon">✉️</span> Contacts</a>
    </div>
  </aside>

  <!-- Обертка контента -->
  <div class="content-wrapper">
    <header>
      <div class="header-left">
        <button class="menu-btn" id="menuBtn" aria-label="Toggle menu">
          <span></span><span></span><span></span>
        </button>

        <!-- Авторизация -->
        <button class="btn-apple" id="authModalBtn">Sign In</button>
        <div id="userInfo" style="display: none; align-items: center; gap: 10px;">
          <span id="userEmail" style="font-size: 0.85rem; color: var(--text-secondary);"></span>
          <button class="btn-filter" id="logoutBtn">Logout</button>
        </div>
      </div>
      
      <div class="library-tabs">
        <button id="watchedBtn" class="tab-btn active">Watched</button>
        <button id="queueBtn" class="tab-btn">Queue</button>
      </div>
    </header>

    <main>
      <div class="page-header">
        <h1 class="hero-title">My Library.</h1>
        <p class="subtitle">Your personal collection.</p>
      </div>

      <div id="filmContainer" class="movies-grid"></div>
    </main>

    <footer>
      <p>© 2026 | All Rights Reserved | Developed by Frederik Hinez</p>
    </footer>
  </div>

  <!-- Модальное окно авторизации -->
  <div class="modal-backdrop" id="authBackdrop" style="display: none;">
    <div class="modal-box" style="max-width: 400px; padding: 32px;">
      <button class="modal-close" id="closeAuthBtn">&times;</button>
      <h2 class="modal-title" id="authTitle" style="margin-bottom: 20px;">Sign In</h2>
      
      <form id="authForm" style="display: flex; flex-direction: column; gap: 16px;">
        <input type="email" id="authEmail" class="apple-input" placeholder="Email" required>
        <input type="password" id="authPassword" class="apple-input" placeholder="Password" required>
        <button type="submit" class="btn-apple" id="authSubmitBtn">Sign In</button>
      </form>

      <div style="margin-top: 16px; text-align: center; font-size: 0.85rem; color: var(--text-secondary);">
        <span id="authToggleText">Don't have an account?</span>
        <a href="#" id="authToggleLink" style="color: var(--apple-blue); margin-left: 5px;">Sign Up</a>
      </div>
    </div>
  </div>

</body>
</html>
